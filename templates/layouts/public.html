{% extends 'layouts/base.html' %}
{% block layout %}
<header class="topbar container">
  <a class="brand" href="{% url 'home' %}"><span class="brand-mark">✦</span> FinCore<span class="brand-dot">.</span></a>
  <nav class="public-nav" aria-label="Main navigation"><a href="{% url 'home' %}#features" data-i18n="features">Features</a><a href="{% url 'home' %}#how" data-i18n="how">How it works</a></nav>
  <div class="top-actions">
    <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">🇺🇸 EN</button><button type="button" data-lang="fa" aria-pressed="false">🇮🇷 FA</button></div>
    {% if user.is_authenticated %}<a class="btn btn-primary btn-small" href="{% url 'dashboard' %}" data-i18n="dashboard">Dashboard</a>{% else %}<a class="text-link" href="{% url 'login' %}" data-i18n="login">Log in</a><a class="btn btn-primary btn-small" href="{% url 'register' %}" data-i18n="getStarted">Get started</a>{% endif %}
  </div>
</header>
{% block content %}{% endblock %}
<footer class="footer container"><span>© 2026 FinCore</span><span data-i18n="demoDisclaimer">Portfolio demo • No real money</span></footer>
{% endblock %}
